name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the pinned Go toolchain
        run: make toolchain

      - name: Core checks
        run: make check

      - name: Desktop dependencies
        run: make desktop-deps

      - name: Desktop typecheck and build
        run: make desktop-check

      - name: Install network audit tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth strace

      - name: Network audit
        id: network_audit
        run: make audit-network

      - name: Publish network audit failure
        if: failure() && steps.network_audit.outcome == 'failure'
        run: |
          {
            echo "## Network audit failure"
            echo '```'
            cat .tmp/audit-network/audit.log 2>/dev/null || true
            cat .tmp/audit-network/strace-violations.log 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload network audit log
        if: failure() && steps.network_audit.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: network-audit
          path: .tmp/audit-network/*.log
          if-no-files-found: ignore

      - name: Build AppImage
        run: make appimage

      - name: Checksums
        run: make checksums

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            desktop/release/*.AppImage
            desktop/release/SHA256SUMS
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: Build portable app
        shell: pwsh
        run: ./platforms/windows/build.ps1

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem desktop/release/*.exe
          if (-not $files) { throw "no Windows executable built" }
          $lines = foreach ($file in $files) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          $lines | Set-Content desktop/release/SHA256SUMS
          $lines

      - name: Upload portable app
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            .tools
            .cache
          key: android-${{ runner.os }}-${{ hashFiles('platforms/android/setup.sh', 'platforms/android/env.sh', '.go-version') }}

      - name: Install Go toolchain
        run: make toolchain

      - name: Install Android toolchain
        run: make android-setup

      - name: Android unit tests
        run: make android-test

      - name: Build debug APK
        run: make android-apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

