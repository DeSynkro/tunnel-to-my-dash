name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the pinned Go toolchain
        run: make toolchain

      - name: Core checks
        run: make check

      - name: Desktop dependencies
        run: make desktop-deps

      - name: Desktop typecheck and build
        run: make desktop-check

      - name: Install network audit tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth strace

      - name: Network audit
        id: network_audit
        run: make audit-network

      - name: Publish network audit failure
        if: failure() && steps.network_audit.outcome == 'failure'
        run: |
          {
            echo "## Network audit failure"
            echo '```'
            cat .tmp/audit-network/audit.log 2>/dev/null || true
            cat .tmp/audit-network/strace-violations.log 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload network audit log
        if: failure() && steps.network_audit.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-audit
          path: .tmp/audit-network/*.log
          if-no-files-found: ignore

      - name: Build AppImage
        run: make appimage

      - name: Verify packaged AppImage
        run: |
          rm -rf "$RUNNER_TEMP/ttmd-appimage-smoke"
          log="$RUNNER_TEMP/appimage-smoke.log"
          if ! timeout 60s env TTMD_DATA_DIR="$RUNNER_TEMP/ttmd-appimage-smoke" TTMD_SMOKE=idle \
            xvfb-run -a desktop/release/Tunnel-to-My-Dash-*.AppImage --appimage-extract-and-run >"$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          grep -q '\[smoke\] idle screen=setup' "$log"
          tail -n 5 "$log"

      - name: Checksums
        run: make checksums

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage
          path: |
            desktop/release/*.AppImage
            desktop/release/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"

      - name: Build portable app
        shell: pwsh
        run: ./platforms/windows/build.ps1

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem desktop/release/*.exe
          if (-not $files) { throw "no Windows executable built" }
          $lines = foreach ($file in $files) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          $lines | Set-Content desktop/release/SHA256SUMS
          $lines

      - name: Upload portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Android toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            .cache
          key: android-${{ runner.os }}-${{ hashFiles('platforms/android/setup.sh', 'platforms/android/env.sh', '.go-version') }}

      - name: Install Go toolchain
        run: make toolchain

      - name: Install Android toolchain
        run: make android-setup

      - name: Android unit tests
        run: make android-test

      - name: Build debug APK
        run: make android-apk

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  android-release:
    name: Android release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TTMD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TTMD_ANDROID_KEYSTORE_PASSWORD }}
      TTMD_ANDROID_KEY_ALIAS: ${{ secrets.TTMD_ANDROID_KEY_ALIAS }}
      TTMD_ANDROID_KEY_PASSWORD: ${{ secrets.TTMD_ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Android toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            .cache
          key: android-${{ runner.os }}-${{ hashFiles('platforms/android/setup.sh', 'platforms/android/env.sh', '.go-version') }}

      - name: Install Go toolchain
        run: make toolchain

      - name: Install Android toolchain
        run: make android-setup

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TTMD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          echo "TTMD_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: make android-release

      - name: Verify release certificate
        run: |
          source platforms/android/env.sh
          APK=platforms/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          mkdir -p release-assets
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | tee release-assets/release-certs.txt
          if grep -q 'CN=Android Debug' release-assets/release-certs.txt; then
            echo "error: release APK is signed with the debug key" >&2
            exit 1
          fi
          fingerprint="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}' release-assets/release-certs.txt)"
          if [ "$fingerprint" != "43d345d897734c1c1a3b0dc77c06ae4c66ffb27bb89144f1c69730f65f00c013" ]; then
            echo "error: unexpected release certificate: $fingerprint" >&2
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q 'application-debuggable'; then
            echo "error: release APK is debuggable" >&2
            exit 1
          fi
          version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' platforms/android/app/build.gradle.kts | head -n 1)"
          test -n "$version"
          cp "$APK" "release-assets/tunnel-to-my-dash-${version}.apk"
          (cd release-assets && sha256sum "tunnel-to-my-dash-${version}.apk" | tee SHA256SUMS)
          cat release-assets/SHA256SUMS

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-apk
          path: release-assets/
          if-no-files-found: error
